name: Windows Desktop Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate desktop version files
        shell: pwsh
        run: |
          $package = Get-Content 'desktop/package.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $tauri = Get-Content 'desktop/src-tauri/tauri.conf.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $cargoVersion = Select-String -Path 'desktop/src-tauri/Cargo.toml' -Pattern '^\s*version\s*=\s*"(?<version>[^"]+)"' | Select-Object -First 1

          if (-not $cargoVersion) {
            throw 'Version field was not found in desktop/src-tauri/Cargo.toml.'
          }

          $versions = @{
            'desktop/package.json' = [string]$package.version
            'desktop/src-tauri/tauri.conf.json' = [string]$tauri.version
            'desktop/src-tauri/Cargo.toml' = [string]$cargoVersion.Matches[0].Groups['version'].Value
          }

          $distinctVersions = @($versions.Values | Sort-Object -Unique)
          if ($distinctVersions.Count -ne 1) {
            $details = $versions.GetEnumerator() |
              Sort-Object Name |
              ForEach-Object { "$($_.Name) => $($_.Value)" }
            $detailText = $details -join [Environment]::NewLine
            throw "Desktop version files are out of sync.$([Environment]::NewLine)$detailText"
          }

          Write-Output "Desktop version files are synchronized: $($distinctVersions[0])"

      - name: Validate tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content 'desktop/package.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $expectedVersion = [string]$package.version
          $tagVersion = '${{ github.ref_name }}'
          if ($tagVersion.StartsWith('v')) {
            $tagVersion = $tagVersion.Substring(1)
          }

          if ($tagVersion -ne $expectedVersion) {
            throw "Tag version mismatch. Tag=${{ github.ref_name }}, desktop version=$expectedVersion"
          }

          Write-Output "Tag matches desktop version: $expectedVersion"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.0,<7"

      - name: Build bundled Python backend
        shell: pwsh
        run: ./scripts/build_bundled_backend.ps1

      - name: Build Windows desktop bundle
        working-directory: desktop
        env:
          CI: "true"
        run: npm run tauri:build

      - name: Verify localized frontend resources
        shell: pwsh
        run: ./scripts/verify_localized_frontend.ps1

      - name: Verify localized Windows installers
        shell: pwsh
        run: |
          $msiDirectory = 'desktop/src-tauri/target/release/bundle/msi'
          $msis = @(Get-ChildItem $msiDirectory -Recurse -Filter *.msi)
          foreach ($language in @('en-US', 'zh-CN')) {
            $localizedMsi = @($msis | Where-Object { $_.BaseName.Contains($language) })
            if ($localizedMsi.Count -eq 0) {
              throw "WiX installer for $language was not generated."
            }
            Write-Output "Found WiX installer for ${language}: $($localizedMsi[0].Name)"
          }

          $nsisDirectory = 'desktop/src-tauri/target/release/bundle/nsis'
          $nsisInstallers = @(Get-ChildItem $nsisDirectory -Recurse -Filter *.exe)
          if ($nsisInstallers.Count -eq 0) {
            throw 'NSIS installer was not generated.'
          }
          Write-Output "Found NSIS multilingual installer: $($nsisInstallers[0].Name)"

      - name: Smoke test installed desktop bundle
        shell: pwsh
        run: |
          $builtExe = Get-ChildItem 'desktop/src-tauri/target/release' -Filter *.exe |
            Where-Object { $_.Name -ne 'file_pilot_api.exe' } |
            Select-Object -First 1
          if (-not $builtExe) {
            throw "Built desktop executable was not found."
          }
          $desktopExeName = $builtExe.Name

          foreach ($language in @('en-US', 'zh-CN')) {
            $msi = Get-ChildItem 'desktop/src-tauri/target/release/bundle/msi' -Recurse -Filter *.msi |
              Where-Object { $_.BaseName.Contains($language) } |
              Select-Object -First 1
            if (-not $msi) {
              throw "$language MSI bundle was not found."
            }

            Write-Output "Installing $language MSI: $($msi.Name)"
            $install = Start-Process msiexec.exe -ArgumentList '/i', $msi.FullName, '/qn', '/norestart' -PassThru -Wait
            if ($install.ExitCode -ne 0) {
              throw "$language MSI install failed with exit code $($install.ExitCode)"
            }

            try {
              $candidates = @(
                (Join-Path $env:LOCALAPPDATA "Programs\FilePilot\$desktopExeName"),
                (Join-Path $env:ProgramFiles "FilePilot\$desktopExeName"),
                (Join-Path ${env:ProgramFiles(x86)} "FilePilot\$desktopExeName")
              ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }

              $app = $candidates | Select-Object -First 1
              if (-not $app) {
                $searchRoots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
                foreach ($root in $searchRoots) {
                  $match = Get-ChildItem $root -Recurse -Filter $desktopExeName -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($match) {
                    $app = $match.FullName
                    break
                  }
                }
              }

              if (-not $app) {
                throw "Installed $desktopExeName was not found after $language MSI install."
              }

              & powershell -ExecutionPolicy Bypass -File scripts\smoke_desktop_bundle.ps1 -AppPath $app
              if ($LASTEXITCODE -ne 0) {
                throw "$language desktop smoke test failed with exit code $LASTEXITCODE"
              }
            } finally {
              $uninstall = Start-Process msiexec.exe -ArgumentList '/x', $msi.FullName, '/qn', '/norestart' -PassThru -Wait
              if ($uninstall.ExitCode -ne 0) {
                throw "$language MSI uninstall failed with exit code $($uninstall.ExitCode)"
              }
            }
          }

      - name: Dump desktop smoke diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:APPDATA 'com.filepilot.desktop'
          Write-Output "runtimeRoot=$runtimeRoot"
          if (Test-Path -LiteralPath $runtimeRoot) {
            Get-ChildItem $runtimeRoot -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 240 | Write-Output
          }

          $runtimeFile = Join-Path $runtimeRoot 'output\runtime\backend.json'
          if (Test-Path -LiteralPath $runtimeFile) {
            Write-Output '=== backend.json ==='
            Get-Content -LiteralPath $runtimeFile -Raw -Encoding utf8 | Write-Output
          }

          $logFile = Join-Path $runtimeRoot 'logs\backend\runtime.log'
          if (Test-Path -LiteralPath $logFile) {
            Write-Output '=== runtime.log ==='
            Get-Content -LiteralPath $logFile -Encoding utf8 | Select-Object -Last 120 | Write-Output
          }

          Get-Process -Name 'file_pilot_api' -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path -AutoSize | Out-String -Width 240 | Write-Output

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: filepilot-windows-bundle-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FilePilot ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
