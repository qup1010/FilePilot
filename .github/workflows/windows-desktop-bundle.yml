name: Windows Desktop Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate desktop version files
        shell: pwsh
        run: |
          $package = Get-Content 'desktop/package.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $tauri = Get-Content 'desktop/src-tauri/tauri.conf.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $cargoVersion = Select-String -Path 'desktop/src-tauri/Cargo.toml' -Pattern '^\s*version\s*=\s*"(?<version>[^"]+)"' | Select-Object -First 1

          if (-not $cargoVersion) {
            throw 'Version field was not found in desktop/src-tauri/Cargo.toml.'
          }

          $versions = @{
            'desktop/package.json' = [string]$package.version
            'desktop/src-tauri/tauri.conf.json' = [string]$tauri.version
            'desktop/src-tauri/Cargo.toml' = [string]$cargoVersion.Matches[0].Groups['version'].Value
          }

          $distinctVersions = @($versions.Values | Sort-Object -Unique)
          if ($distinctVersions.Count -ne 1) {
            $details = $versions.GetEnumerator() |
              Sort-Object Name |
              ForEach-Object { "$($_.Name) => $($_.Value)" }
            $detailText = $details -join [Environment]::NewLine
            throw "Desktop version files are out of sync.$([Environment]::NewLine)$detailText"
          }

          Write-Output "Desktop version files are synchronized: $($distinctVersions[0])"

      - name: Validate tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content 'desktop/package.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $expectedVersion = [string]$package.version
          $tagVersion = '${{ github.ref_name }}'
          if ($tagVersion.StartsWith('v')) {
            $tagVersion = $tagVersion.Substring(1)
          }

          if ($tagVersion -ne $expectedVersion) {
            throw "Tag version mismatch. Tag=${{ github.ref_name }}, desktop version=$expectedVersion"
          }

          Write-Output "Tag matches desktop version: $expectedVersion"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.0,<7"

      - name: Build bundled Python backend
        shell: pwsh
        run: ./scripts/build_bundled_backend.ps1

      - name: Build Windows desktop bundle
        working-directory: desktop
        env:
          CI: "true"
        run: npm run tauri:build

      - name: Verify localized frontend resources
        shell: pwsh
        run: ./scripts/verify_localized_frontend.ps1

      - name: Verify localized Windows installers
        shell: pwsh
        run: |
          $msiDirectory = 'desktop/src-tauri/target/release/bundle/msi'
          $msis = @(Get-ChildItem $msiDirectory -Recurse -Filter *.msi)
          foreach ($language in @('en-US', 'zh-CN')) {
            $localizedMsi = @($msis | Where-Object { $_.BaseName.Contains($language) })
            if ($localizedMsi.Count -eq 0) {
              throw "WiX installer for $language was not generated."
            }
            Write-Output "Found WiX installer for ${language}: $($localizedMsi[0].Name)"
          }

          $nsisDirectory = 'desktop/src-tauri/target/release/bundle/nsis'
          $nsisInstallers = @(Get-ChildItem $nsisDirectory -Recurse -Filter 'FilePilot_*_x64-setup.exe')
          if ($nsisInstallers.Count -eq 0) {
            throw 'NSIS installer was not generated.'
          }
          Write-Output "Found NSIS multilingual installer: $($nsisInstallers[0].Name)"

      - name: Smoke test installed desktop bundle
        shell: pwsh
        env:
          CI: "true"
        run: |
          $builtExe = Get-ChildItem 'desktop/src-tauri/target/release' -Filter *.exe |
            Where-Object { $_.Name -ne 'file_pilot_api.exe' } |
            Select-Object -First 1
          if (-not $builtExe) {
            throw "Built desktop executable was not found."
          }
          $desktopExeName = $builtExe.Name

          foreach ($language in @('en-US', 'zh-CN')) {
            $msi = Get-ChildItem 'desktop/src-tauri/target/release/bundle/msi' -Recurse -Filter *.msi |
              Where-Object { $_.BaseName.Contains($language) } |
              Select-Object -First 1
            if (-not $msi) {
              throw "$language MSI bundle was not found."
            }

            Write-Output "Installing $language MSI: $($msi.Name)"
            $install = Start-Process msiexec.exe -ArgumentList '/i', $msi.FullName, '/qn', '/norestart' -PassThru -Wait
            if ($install.ExitCode -ne 0) {
              throw "$language MSI install failed with exit code $($install.ExitCode)"
            }

            try {
              $candidates = @(
                (Join-Path $env:LOCALAPPDATA "Programs\FilePilot\$desktopExeName"),
                (Join-Path $env:ProgramFiles "FilePilot\$desktopExeName"),
                (Join-Path ${env:ProgramFiles(x86)} "FilePilot\$desktopExeName")
              ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }

              $app = $candidates | Select-Object -First 1
              if (-not $app) {
                $searchRoots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
                foreach ($root in $searchRoots) {
                  $match = Get-ChildItem $root -Recurse -Filter $desktopExeName -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($match) {
                    $app = $match.FullName
                    break
                  }
                }
              }

              if (-not $app) {
                throw "Installed $desktopExeName was not found after $language MSI install."
              }

              & powershell -ExecutionPolicy Bypass -File scripts\smoke_desktop_bundle.ps1 -AppPath $app -VerifyUiLanguages
              if ($LASTEXITCODE -ne 0) {
                throw "$language desktop smoke test failed with exit code $LASTEXITCODE"
              }
            } finally {
              $uninstall = Start-Process msiexec.exe -ArgumentList '/x', $msi.FullName, '/qn', '/norestart' -PassThru -Wait
              if ($uninstall.ExitCode -ne 0) {
                throw "$language MSI uninstall failed with exit code $($uninstall.ExitCode)"
              }
            }
          }

      - name: Smoke test multilingual NSIS installer
        shell: pwsh
        env:
          CI: "true"
        run: |
          $builtExe = Get-ChildItem 'desktop/src-tauri/target/release' -Filter *.exe |
            Where-Object { $_.Name -ne 'file_pilot_api.exe' } |
            Select-Object -First 1
          if (-not $builtExe) {
            throw 'Built desktop executable was not found.'
          }
          $desktopExeName = $builtExe.Name

          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Recurse -Filter 'FilePilot_*_x64-setup.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Multilingual NSIS installer was not found.'
          }

          foreach ($language in @(@{ Name = 'en-US'; Id = '1033' }, @{ Name = 'zh-CN'; Id = '2052' })) {
            $installDir = Join-Path $env:RUNNER_TEMP "filepilot-nsis-$($language.Name)"
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force
            }

            Write-Output "Installing NSIS bundle in $($language.Name): $($installer.Name)"
            $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/LANG=$($language.Id)", "/D=$installDir") -PassThru -Wait
            if ($install.ExitCode -ne 0) {
              throw "NSIS $($language.Name) install failed with exit code $($install.ExitCode)."
            }

            try {
              $app = Join-Path $installDir $desktopExeName
              if (-not (Test-Path -LiteralPath $app)) {
                throw "Installed $desktopExeName was not found after NSIS $($language.Name) install."
              }

              & powershell -ExecutionPolicy Bypass -File scripts\smoke_desktop_bundle.ps1 -AppPath $app -VerifyUiLanguages
              if ($LASTEXITCODE -ne 0) {
                throw "NSIS $($language.Name) desktop smoke test failed with exit code $LASTEXITCODE."
              }
            } finally {
              $uninstaller = Join-Path $installDir 'uninstall.exe'
              if (-not (Test-Path -LiteralPath $uninstaller)) {
                throw "NSIS uninstaller was not found after $($language.Name) install."
              }

              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
              if ($uninstall.ExitCode -ne 0) {
                throw "NSIS $($language.Name) uninstall failed with exit code $($uninstall.ExitCode)."
              }
            }
          }

      - name: Download previous Windows installers for upgrade smoke
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tauriConfig = Get-Content 'desktop/src-tauri/tauri.conf.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if ([version]$tauriConfig.version -le [version]'1.0.5') {
            Write-Output "Skipping upgrade smoke: no release older than $($tauriConfig.version) is configured."
            exit 0
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0.5" `
            -Headers @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GITHUB_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
          $previousMsi = @($release.assets | Where-Object { $_.name -match '^FilePilot_1\.0\.5_x64(?:_.*)?\.msi$' } | Sort-Object { if ($_.name -match '_en-US\.msi$') { 0 } else { 1 } } | Select-Object -First 1)
          $previousNsis = @($release.assets | Where-Object { $_.name -eq 'FilePilot_1.0.5_x64-setup.exe' } | Select-Object -First 1)
          if (-not $previousMsi) {
            throw 'Previous WiX MSI release asset for v1.0.5 was not found.'
          }
          if (-not $previousNsis) {
            throw 'Previous NSIS release asset for v1.0.5 was not found.'
          }

          foreach ($asset in @($previousMsi[0], $previousNsis[0])) {
            $assetName = $asset.name
            $installerPath = Join-Path $env:RUNNER_TEMP $assetName
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installerPath
            $download = Get-Item -LiteralPath $installerPath
            if ($download.Length -lt 10MB) {
              throw "Previous Windows installer download is unexpectedly small: $($download.Length) bytes"
            }
            $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
            Write-Output "Downloaded $assetName ($($download.Length) bytes, SHA-256 $hash)."
          }

      - name: Smoke test WiX MSI upgrade and data preservation
        shell: pwsh
        env:
          CI: "true"
        run: |
          $tauriConfig = Get-Content 'desktop/src-tauri/tauri.conf.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if ([version]$tauriConfig.version -le [version]'1.0.5') {
            Write-Output "Skipping MSI upgrade smoke: no release older than $($tauriConfig.version) is configured."
            exit 0
          }

          $builtExe = Get-ChildItem 'desktop/src-tauri/target/release' -Filter *.exe |
            Where-Object { $_.Name -ne 'file_pilot_api.exe' } |
            Select-Object -First 1
          $currentMsi = Get-ChildItem 'desktop/src-tauri/target/release/bundle/msi' -Recurse -Filter 'FilePilot_*_x64_en-US.msi' |
            Select-Object -First 1
          $previousMsi = Get-ChildItem $env:RUNNER_TEMP -Filter 'FilePilot_1.0.5_x64*.msi' -File |
            Select-Object -First 1
          if (-not $builtExe -or -not $currentMsi -or -not $previousMsi) {
            throw 'A previous MSI, current desktop executable, or current en-US MSI was not found for the upgrade smoke test.'
          }

          & scripts/smoke_msi_upgrade.ps1 `
            -PreviousInstallerPath $previousMsi.FullName `
            -CurrentInstallerPath $currentMsi.FullName `
            -PreviousVersion '1.0.5' `
            -CurrentVersion ([string]$tauriConfig.version) `
            -DesktopExecutableName $builtExe.Name `
            -VerifyUiLanguages
          if (-not $?) {
            throw 'WiX MSI upgrade smoke test failed.'
          }

      - name: Smoke test NSIS upgrade and data preservation
        shell: pwsh
        env:
          CI: "true"
        run: |
          $tauriConfig = Get-Content 'desktop/src-tauri/tauri.conf.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if ([version]$tauriConfig.version -le [version]'1.0.5') {
            Write-Output "Skipping NSIS upgrade smoke: no release older than $($tauriConfig.version) is configured."
            exit 0
          }

          $builtExe = Get-ChildItem 'desktop/src-tauri/target/release' -Filter *.exe |
            Where-Object { $_.Name -ne 'file_pilot_api.exe' } |
            Select-Object -First 1
          if (-not $builtExe) {
            throw 'Built desktop executable was not found.'
          }

          $previousNsis = Join-Path $env:RUNNER_TEMP 'FilePilot_1.0.5_x64-setup.exe'
          if (-not (Test-Path -LiteralPath $previousNsis)) {
            throw "Previous NSIS installer was not downloaded: $previousNsis"
          }

          $currentInstaller = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Recurse -Filter 'FilePilot_*_x64-setup.exe' |
            Select-Object -First 1
          if (-not $currentInstaller) {
            throw 'Current multilingual NSIS installer was not found.'
          }

          & scripts/smoke_nsis_upgrade.ps1 `
            -PreviousInstallerPath $previousNsis `
            -CurrentInstallerPath $currentInstaller.FullName `
            -PreviousVersion '1.0.5' `
            -CurrentVersion ([string]$tauriConfig.version) `
            -DesktopExecutableName $builtExe.Name `
            -VerifyUiLanguages
          if (-not $?) {
            throw 'NSIS upgrade smoke test failed.'
          }

      - name: Dump desktop smoke diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:APPDATA 'com.filepilot.desktop'
          Write-Output "runtimeRoot=$runtimeRoot"
          if (Test-Path -LiteralPath $runtimeRoot) {
            Get-ChildItem $runtimeRoot -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 240 | Write-Output
          }

          $runtimeFile = Join-Path $runtimeRoot 'output\runtime\backend.json'
          if (Test-Path -LiteralPath $runtimeFile) {
            Write-Output '=== backend.json ==='
            Get-Content -LiteralPath $runtimeFile -Raw -Encoding utf8 | Write-Output
          }

          $logFile = Join-Path $runtimeRoot 'logs\backend\runtime.log'
          if (Test-Path -LiteralPath $logFile) {
            Write-Output '=== runtime.log ==='
            Get-Content -LiteralPath $logFile -Encoding utf8 | Select-Object -Last 120 | Write-Output
          }

          Get-Process -Name 'file_pilot_api' -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path -AutoSize | Out-String -Width 240 | Write-Output

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: filepilot-windows-bundle-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FilePilot ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
